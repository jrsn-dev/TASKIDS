name: Android real screenshots
# Real emulator capture fixed coordinates

on:
  push:
    branches:
      - refactor/taskids-v2-ux-architecture
    paths:
      - ".github/workflows/android-screenshots.yml"

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm || true

      - name: Capture screenshots on Android emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -eux
            mkdir -p screenshots
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.aistudio.kidstasks.pqwxzt
            adb shell monkey -p com.aistudio.kidstasks.pqwxzt -c android.intent.category.LAUNCHER 1
            sleep 5

            adb exec-out screencap -p > screenshots/01-home-infantil.png

            # Open parental PIN from the current 2400x1080 landscape Home.
            adb shell input tap 2260 82
            sleep 2
            adb exec-out screencap -p > screenshots/02-pin-pais.png

            # PIN padrão 0000. The zero key is centered at the bottom of the keypad.
            adb shell input tap 1200 1045
            adb shell input tap 1200 1045
            adb shell input tap 1200 1045
            adb shell input tap 1200 1045
            sleep 5
            adb exec-out screencap -p > screenshots/03-dashboard-pais-mobile.png

      - name: Upload real app screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TASKIDS-real-screenshots
          path: screenshots/*.png
          if-no-files-found: error
          retention-days: 14
