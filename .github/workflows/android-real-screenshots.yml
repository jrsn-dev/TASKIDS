name: Android real screenshots

on:
  workflow_dispatch:
  push:
    branches:
      - refactor/taskids-v2-ux-architecture
    paths:
      - ".github/workflows/android-real-screenshots.yml"

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Capture screenshots on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -e
            mkdir -p real-screenshots
            adb install -r app/build/outputs/apk/debug/app-debug.apk

            adb shell am force-stop com.aistudio.kidstasks.pqwxzt
            adb shell am start -n com.aistudio.kidstasks.pqwxzt/com.example.MainActivity
            sleep 6
            adb shell screencap -p /sdcard/home.png
            adb pull /sdcard/home.png real-screenshots/01-home-game.png

            tap_text() {
              TEXT="$1"
              adb shell uiautomator dump /sdcard/window.xml >/dev/null
              adb pull /sdcard/window.xml /tmp/window.xml >/dev/null
              python3 - "$TEXT" <<'PY'
            import re, sys, subprocess, xml.etree.ElementTree as ET
            target=sys.argv[1]
            root=ET.parse("/tmp/window.xml").getroot()
            matches=[]
            for node in root.iter("node"):
                text=node.attrib.get("text","")
                desc=node.attrib.get("content-desc","")
                if text == target or desc == target:
                    b=node.attrib.get("bounds","")
                    m=re.match(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]", b)
                    if m:
                        x1,y1,x2,y2=map(int,m.groups())
                        matches.append(((x1+x2)//2,(y1+y2)//2,text,desc,b))
            if not matches:
                print("NOT_FOUND:"+target)
                sys.exit(2)
            x,y,_,_,b=matches[0]
            print(f"TAP {target} at {x},{y} {b}")
            subprocess.check_call(["adb","shell","input","tap",str(x),str(y)])
            PY
              sleep 1
            }

            tap_text "PAIS"
            sleep 2
            adb shell screencap -p /sdcard/pin.png
            adb pull /sdcard/pin.png real-screenshots/02-parent-pin.png

            tap_text "0"
            tap_text "0"
            tap_text "0"
            tap_text "0"
            sleep 5
            adb shell screencap -p /sdcard/parent.png
            adb pull /sdcard/parent.png real-screenshots/03-parent-dashboard.png

            tap_text "Missões" || true
            sleep 2
            adb shell screencap -p /sdcard/missions.png
            adb pull /sdcard/missions.png real-screenshots/04-parent-missions.png

            adb shell input swipe 850 180 200 180 500 || true
            sleep 1
            tap_text "Biblioteca" || true
            sleep 3
            adb shell screencap -p /sdcard/library.png
            adb pull /sdcard/library.png real-screenshots/05-parent-library.png

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TASKIDS-real-app-screenshots
          path: real-screenshots/*.png
          if-no-files-found: warn
          retention-days: 14
